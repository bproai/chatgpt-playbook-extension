<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PiEVerse Prompt Pro</title>
  <style>
    body {
      width: 360px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #000000;
      color: #ffffff;
    }
    
    .container {
      padding: 0;
    }
    
    .header {
      text-align: center;
      padding: 24px;
      background: #111111;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 4px rgba(255,255,255,0.1));
    }

    .header-text {
      font-size: 14px;
      color: #666666;
      margin-top: 8px;
    }

    .playbook-section {
      padding: 16px;
    }

    .playbook-card {
      background: #111111;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playbook-card:hover {
      background: #222222;
      transform: translateY(-2px);
    }

    .playbook-title {
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
    }

    .playbook-description {
      font-size: 12px;
      color: #666666;
      margin-top: 4px;
    }

    .category-label {
      font-size: 12px;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px;
      padding: 0 16px;
    }

    .action-icon {
      color: #666666;
      font-size: 20px;
    }

    .playbook-card:hover .action-icon {
      color: #ffffff;
    }

    .footer {
      font-size: 12px;
      color: #666666;
      text-align: center;
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .footer a {
      color: #666666;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover {
      color: #ffffff;
    }

    .notification {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .notification.show {
      opacity: 1;
    }

    .notification.error {
      background: rgba(255,59,48,0.1);
      color: #ff3b30;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">

              </g>
            </g>
          </g>
        </svg>
      </div>
      <div class="header-text">Your AI Assistant Playbook</div>
    </div>

    <div class="category-label">Writing & Analysis</div>
    <div class="playbook-section">
      <div class="playbook-card" data-prompt="Please provide a comprehensive analysis of the following text, focusing on key themes, arguments, and supporting evidence:">
        <div>
          <div class="playbook-title">Deep Analysis</div>
          <div class="playbook-description">Analyze text for themes and arguments</div>
        </div>
        <span class="action-icon">→</span>
      </div>

      <div class="playbook-card" data-prompt="Please summarize the main points of the following text in a clear and concise manner:">
        <div>
          <div class="playbook-title">Quick Summary</div>
          <div class="playbook-description">Get key points and takeaways</div>
        </div>
        <span class="action-icon">→</span>
      </div>
    </div>

    <div class="category-label">Code & Development</div>
    <div class="playbook-section">
      <div class="playbook-card" data-prompt="Please write clean, well-documented code that accomplishes the following:">
        <div>
          <div class="playbook-title">Code Generation</div>
          <div class="playbook-description">Get production-ready code</div>
        </div>
        <span class="action-icon">→</span>
      </div>

      <div class="playbook-card" data-prompt="Please review the following code and suggest improvements for better performance, readability, and maintainability:">
        <div>
          <div class="playbook-title">Code Review</div>
          <div class="playbook-description">Get expert code feedback</div>
        </div>
        <span class="action-icon">→</span>
      </div>
    </div>

    <div class="notification" id="notification"></div>
  </div>

  <div class="footer">
    <a href="#" id="addCustom">Add Custom</a>
    <a href="#" id="settings">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
