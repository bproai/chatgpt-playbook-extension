<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Playbook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      margin: 0;
      padding: 10px;
    }
    h2 {
      margin-top: 0;
    }
    .prompt {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .prompt:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h2>ChatGPT Playbooks</h2>
  <div id="playbooks">
    <!-- Playbook entries will be dynamically inserted here -->
  </div>
  <script src="popup.js"></script>
</body>
</html>
